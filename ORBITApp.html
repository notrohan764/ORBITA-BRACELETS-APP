<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c10">
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchicon" href="data:,">
<title>ORBITA – Bracelet App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0c10; --card:#17161b; --card2:#1e1d23; --ink:#f4efe8; --body:#c9c3cc; --muted:#a09aa6; --dim:#6d6974;
    --line:rgba(244,239,232,.08); --line2:rgba(244,239,232,.16); --accent:#5b8cff; --bad:#ff6b6b; --ok:#6fd6a8;
    --sans:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1); --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.25,.5,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overflow-x:hidden}
  button,select,input{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  .app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:14px 18px calc(120px + env(safe-area-inset-bottom))}
  .orbits{position:fixed;left:50%;top:-60px;width:1100px;transform:translateX(-50%);pointer-events:none;z-index:0;opacity:.8}
  .orbits .ring{transform-origin:600px 420px;animation:drift 80s linear infinite}
  @keyframes drift{to{transform:rotate(360deg)}}

  /* ---------- motion ---------- */
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  .view.enter > *{animation:rise .5s var(--ease) both}
  .view.enter > *:nth-child(2){animation-delay:.04s}
  .view.enter > *:nth-child(3){animation-delay:.08s}
  .view.enter > *:nth-child(4){animation-delay:.12s}
  .view.enter > *:nth-child(5){animation-delay:.16s}
  .view.enter > *:nth-child(6){animation-delay:.2s}
  .view.enter > *:nth-child(n+7){animation-delay:.24s}
  .view{transition:opacity .16s ease,transform .16s ease}
  .view.leaving{opacity:0;transform:translateY(-6px)}
  body.booting .view > *{animation-play-state:paused}
  body.booting{overflow:hidden}
  .press:active{transform:scale(.97)}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 22px}
  .brand{display:flex;align-items:center;gap:11px}
  .appicon{width:36px;height:36px;border-radius:10px;background:#0A0A0B;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
  .appicon svg{width:30px;height:30px;display:block}
  .appicon.lg{width:64px;height:64px;border-radius:17px}
  .appicon.lg svg{width:52px;height:52px}
  .brand b{font-family:Jost,var(--sans);font-weight:400;letter-spacing:.42em;font-size:15px}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;transition:transform .15s var(--ease),background .2s}
  .iconbtn:hover{background:rgba(244,239,232,.04)}
  .iconbtn:active{transform:scale(.92)}

  /* ---------- type ---------- */
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1.title{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.035em;margin:0}
  h1.title i{color:var(--accent);font-style:normal}
  .lede{color:var(--muted);font-size:14.5px;margin:6px 0 0}
  .head{margin-bottom:18px}
  .head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .gtitle{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 9px}
  .gtitle .eyebrow{font-size:10.5px}
  .gtitle button{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px}
  .foot{color:var(--dim);font-size:12.5px;margin:10px 4px 0;line-height:1.5}
  .foot b{color:var(--muted);font-weight:600}

  /* ---------- grouped list ---------- */
  .group{background:var(--card);border-radius:18px;overflow:hidden}
  .row{position:relative;display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
  .row + .row{box-shadow:inset 0 1px 0 var(--line)}
  .row.link{cursor:pointer;transition:background .15s}
  .row.link:active{background:rgba(244,239,232,.04)}
  .row .k{flex:1;min-width:0;font-size:15px;font-weight:500}
  .row .k small{display:block;color:var(--muted);font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row .v{color:var(--muted);font-size:14.5px;text-align:right;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--dim);flex:none}
  .row select.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;-webkit-appearance:none;border:0}
  .row.stack{flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px 14px}
  .row.stack .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
  .rin{width:100%;background:none;border:0;outline:none;color:var(--ink);font-size:16px;padding:0}
  .rin::placeholder{color:#58545f}
  .row.stack{transition:background .25s ease}
  .row.stack:focus-within{background:rgba(91,140,255,.05)}
  .row.add{color:var(--accent);font-weight:600;justify-content:center}
  .row.danger .k{color:var(--bad)}
  .warnline{font-size:12.5px;color:#ffb3b3;margin:0 4px;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--out),opacity .3s ease,margin .4s var(--out)}
  .warnline.show{max-height:60px;opacity:1;margin-top:8px}

  .bdg{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#ECECEF,#9DA0A8);display:grid;place-items:center;font-weight:700;font-size:12px;color:#17161b;flex:none}
  .num{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none;transition:background .3s,color .3s}
  .row.active .num{background:var(--c);color:var(--bg)}
  .step{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none;min-width:66px;white-space:nowrap}
  .step i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .row .k small.dflt{color:var(--dim);font-style:italic}
  .pill112{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--bad);border:1px solid rgba(255,107,107,.45);border-radius:999px;padding:2px 7px;flex:none}

  /* switch */
  .switch{position:relative;width:48px;height:29px;flex:none;cursor:pointer;display:inline-block}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:#2b2a31;border-radius:999px;transition:background .25s}
  .switch span:before{content:"";position:absolute;width:23px;height:23px;left:3px;top:3px;background:var(--ink);border-radius:50%;transition:transform .4s var(--out)}
  .switch input:checked+span{background:var(--accent)}
  .switch input:checked+span:before{transform:translateX(19px)}

  /* segmented */
  .seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;padding:4px}
  .seg .ind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--card2);box-shadow:0 1px 0 var(--line2) inset;transition:transform .45s var(--out),width .45s var(--out)}
  .seg button{position:relative;z-index:1;border:0;background:none;padding:10px 8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:color .2s}
  .seg button.on{color:var(--ink)}
  .seg .bdg{width:22px;height:22px;font-size:10px}

  /* buttons */
  .btn:disabled{opacity:.3;pointer-events:none}
  .btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:14px;background:var(--ink);color:var(--bg);transition:transform .15s var(--ease),background .25s,color .25s}
  .btn:active{transform:scale(.96)}
  .btn.acc{background:var(--accent);color:#0d0c10}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .btn.small{padding:8px 14px;font-size:13px}
  .btn.full{width:100%}
  .btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,107,107,.4)}

  /* ---------- home: device card ---------- */
  .device{background:var(--card);border-radius:22px;overflow:hidden}
  .device-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 0 16px}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:500}
  .dot{width:7px;height:7px;border-radius:50%;background:#55525c;transition:background .3s}
  .dot.on{background:var(--accent);animation:ping 2s infinite}
  .dot.busy{background:var(--accent);animation:blink .8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(91,140,255,.55)}70%,100%{box-shadow:0 0 0 7px rgba(91,140,255,0)}}
  @keyframes blink{50%{opacity:.25}}
  .stage svg{display:block;width:100%;height:auto}
  .device-foot{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px;font-size:12.5px;color:var(--dim)}
  .device-foot button{background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 0}
  .hit{cursor:pointer}
  .hit:hover .metal{filter:brightness(1.1)}
  #pod{transition:transform .55s var(--spring)}
  .detached #pod{transform:translateY(-34px)}
  #podFloat{animation:float 4s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-2px)}}
  .socket{opacity:0;transition:opacity .4s}
  .detached .socket{opacity:1}
  .btnshape{transform-box:fill-box;transform-origin:center}
  .pressed{animation:pressed .3s var(--ease)}
  @keyframes pressed{40%{transform:scaleX(.7)}}
  .ripple{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
  .ripple.go{animation:ripple .7s var(--ease)}
  @keyframes ripple{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.2)}}
  #led.live{animation:blink 2.4s infinite}
  .row{transition:background .4s ease}
  .row.flash{background:rgba(91,140,255,.1);transition:background .1s}

  .mini-meter{display:flex;gap:3px;flex:none}
  .mini-meter i{width:14px;height:4px;border-radius:99px;background:var(--line2);transition:background .3s}

  /* ---------- escalation status ---------- */
  .lvl-card{background:var(--card);border-radius:22px;padding:18px 16px 16px}
  .lvl-now{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .lvl-now b{display:block;font-size:22px;letter-spacing:-.02em;font-weight:700}
  .lvl-now b.swap{animation:rise .35s var(--out)}
  .meter{display:flex;gap:5px;margin:16px 0 14px}
  .meter i{flex:1;height:4px;border-radius:99px;background:var(--line2);transition:background .35s;transform-origin:left}
  .meter i.pop{animation:fill .45s var(--ease)}
  @keyframes fill{from{transform:scaleX(0)}}
  .lvl-actions{display:flex;gap:8px}
  .lvl-actions .btn{flex:1}
  .off{opacity:.35;pointer-events:none;transition:opacity .3s}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:0;box-shadow:inset 0 0 0 1px var(--line2);background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--body);transition:transform .14s var(--ease),background .2s,color .2s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--ink);box-shadow:none;color:var(--bg);font-weight:600}
  .chip.add{box-shadow:inset 0 0 0 1px rgba(91,140,255,.5);color:var(--accent)}
  .colors{display:flex;gap:12px}
  .sw{width:26px;height:26px;border-radius:50%;border:0;padding:0;box-shadow:0 0 0 2px var(--card);transition:box-shadow .2s,transform .14s}
  .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
  .sw:active{transform:scale(.9)}

  /* ---------- chats ---------- */
  .crow .av{width:42px;height:42px}
  .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--bg);flex:none}
  .crow .k small.al{color:var(--accent)}
  .crow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--dim);flex:none}
  .ub{min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:#0d0c10;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px;animation:bump .4s var(--spring)}
  @keyframes bump{from{transform:scale(.4)}}
  .thread-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .thread-head b{font-size:17px}
  .thread-head small{display:block;color:var(--muted);font-size:12.5px}
  .msgs{display:flex;flex-direction:column;gap:8px;padding:16px 0 90px}
  .day{align-self:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:4px 0}
  .bub{max-width:80%;padding:10px 13px;border-radius:18px;font-size:15px;animation:pop .35s var(--spring) both}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
  .bub.them{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
  .bub.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
  .bub time{display:block;font-size:10.5px;opacity:.55;margin-top:3px}
  .alert{align-self:stretch;max-width:none;background:var(--card);border-radius:16px;padding:12px 14px;position:relative;overflow:hidden}
  .alert:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
  .alert .eyebrow{color:var(--c,var(--accent));display:block;margin-bottom:5px;font-size:10px}
  .alert p{margin:0 0 4px;font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-size:12px;box-shadow:inset 0 0 0 1px var(--line2);border-radius:999px;padding:4px 9px;color:var(--body);display:inline-flex;align-items:center;gap:6px}
  .tag.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);animation:ping 2s infinite}
  .call112{margin-top:10px;width:100%;border:0;border-radius:12px;padding:11px;font-weight:700;background:var(--bad);color:#fff}
  .composer{transform:translateY(110%);opacity:0;pointer-events:none;transition:transform .45s var(--out),opacity .3s ease}
  .composer.show{transform:none;opacity:1;pointer-events:auto}
  .composer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(13,12,16,0))}
  .composer form{max-width:444px;margin:0 auto;display:flex;gap:8px}
  .composer input{flex:1;border:0;border-radius:999px;padding:13px 18px;background:var(--card);outline:none;font-size:16px;color:var(--ink)}
  .send{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center;transition:transform .14s var(--ease)}
  .send:active{transform:scale(.9)}

  /* ---------- tab bar ---------- */
  .tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:5px;background:rgba(23,22,27,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px var(--line2),0 10px 30px rgba(0,0,0,.4);border-radius:999px;transition:transform .35s var(--ease),opacity .35s}
  .tabs.hide{transform:translateX(-50%) translateY(130%);opacity:0;pointer-events:none}
  .tabs button{position:relative;border:0;background-color:transparent;height:44px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;transition:background-color .4s ease,color .4s ease,padding .5s var(--out)}
  .tabs button span.t{display:inline-block;white-space:nowrap;overflow:hidden;max-width:0;opacity:0;margin-left:0;transition:max-width .55s var(--out),opacity .35s ease,margin-left .55s var(--out)}
  .tabs button.on{background-color:var(--ink);color:var(--bg);padding:0 16px}
  .tabs button.on span.t{max-width:var(--w,120px);opacity:1;margin-left:8px;transition:max-width .55s var(--out),opacity .4s ease .1s,margin-left .55s var(--out)}
  .tabs button:not(.on):hover{color:var(--ink)}
  .tabs svg{flex:none}
  .tabs .ub{position:absolute;top:3px;right:3px;min-width:17px;height:17px;font-size:10px;padding:0 4px}
  .tabs .ub{transition:opacity .3s,transform .3s var(--out)}
  .tabs button.on .ub{opacity:0;transform:scale(.5)}

  /* ---------- sheets ---------- */
  .scrim{position:fixed;inset:0;background:rgba(5,5,8,.66);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .scrim.show{display:flex;animation:fade .3s ease}
  .scrim.closing{animation:fadeOut .32s ease forwards;pointer-events:none}
  @keyframes fade{from{opacity:0}}
  @keyframes fadeOut{to{opacity:0}}
  .sheet{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .5s var(--out);box-shadow:0 -1px 0 var(--line2)}
  @keyframes up{from{transform:translateY(100%)}}
  .scrim.closing .sheet{animation:down .32s cubic-bezier(.4,0,.8,.4) forwards}
  @keyframes down{from{transform:none}to{transform:translateY(100%)}}
  body.locked{overflow:hidden}
  .grab{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .sheet-head h3{font-size:22px;margin:0;font-weight:700;letter-spacing:-.02em}
  .sheet .lede{margin-bottom:6px}
  .choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;padding:16px;margin-top:10px;transition:box-shadow .2s,transform .14s var(--ease)}
  .choice:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  .choice:active{transform:scale(.98)}
  .choice .ic{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--accent);display:grid;place-items:center;flex:none}
  .choice b{display:block;font-size:15.5px;font-weight:600}
  .choice small{color:var(--muted);font-size:13px}
  .lvl-name{width:100%;background:none;border:0;outline:none;color:var(--ink);font-size:24px;font-weight:700;letter-spacing:-.02em;padding:4px 0}
  .sheet-actions{display:flex;gap:8px;margin-top:22px}
  .sheet-actions .btn{flex:1}

  /* ---------- fake call / text ---------- */
  .fakecall{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#1b1a20,#0b0a0d);display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(70px + env(safe-area-inset-top)) 24px calc(60px + env(safe-area-inset-bottom))}
  .fakecall.show{display:flex;animation:fade .3s}
  .fakecall.closing{animation:fadeOut .35s ease forwards}
  .fakecall .who{text-align:center;animation:rise .5s var(--ease) .1s both}
  .fakecall .who b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em}
  .fakecall .who small{color:var(--muted);font-size:15px}
  .fc-av{width:96px;height:96px;border-radius:50%;background:#2b2a31;display:grid;place-items:center;font-size:38px;font-weight:600;margin:0 auto 18px;position:relative}
  .fc-av:before,.fc-av:after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(244,239,232,.25);animation:wave 2s infinite}
  .fc-av:after{animation-delay:1s}
  @keyframes wave{to{transform:scale(1.8);opacity:0}}
  .fc-btns{display:flex;gap:90px;animation:rise .5s var(--ease) .2s both}
  .fc-btns button{width:72px;height:72px;border-radius:50%;border:0;display:grid;place-items:center}
  .fc-btns span{display:block;text-align:center;font-size:13px;color:var(--muted);margin-top:8px}
  .fakebanner{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:70;width:calc(100% - 24px);max-width:440px;transform:translate(-50%,-140%);visibility:hidden;transition:transform .5s var(--spring);background:rgba(40,39,46,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .fakebanner.show{transform:translate(-50%,0);visibility:visible}

  .toast b{font-weight:700}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  /* Launch animation (from the ORBITA splash design, plays once) */
  #splash{position:fixed;inset:0;z-index:100;background:#050506;display:grid;place-items:center;overflow:hidden;transition:opacity .45s var(--ease)}
  #splash.out{opacity:0;pointer-events:none}
  .sp-box{position:relative;width:390px;height:844px;flex:none;font-family:Jost,system-ui,sans-serif;color:#F4F4F1}
  .sp-cap{transform-box:fill-box;transform-origin:center;animation:spCap 4.5s cubic-bezier(.2,.7,.2,1) both}
  .sp-arcB{stroke-dasharray:100;animation:spDrawB 4.5s ease-in-out both}
  .sp-arcF{stroke-dasharray:100;animation:spDrawF 4.5s ease-in-out both}
  .sp-ko{animation:spKo 4.5s linear both}
  .sp-n1,.sp-n2,.sp-n3{transform-box:fill-box;transform-origin:center}
  .sp-n1{animation:spPop1 4.5s cubic-bezier(.3,1.4,.5,1) both}
  .sp-n2{animation:spPop2 4.5s cubic-bezier(.3,1.4,.5,1) both}
  .sp-n3{animation:spPop3 4.5s cubic-bezier(.3,1.4,.5,1) both}
  .sp-nb{transform-box:fill-box;transform-origin:center;animation:spPop3 4.5s cubic-bezier(.3,1.4,.5,1) both,spNb 4.5s linear both}
  .sp-btn{animation:spBtn 4.5s linear both}
  .sp-glow{animation:spGlow 4.5s ease-out both}
  .sp-rip{opacity:0;transform-box:fill-box;transform-origin:center;animation:spRip 4.5s cubic-bezier(.1,.6,.3,1) both}
  .sp-rip2{animation-delay:.18s}
  .sp-wm{animation:spWm 4.5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes spCap{0%{opacity:0;transform:translateY(12px) scale(.96)}8%,100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes spDrawB{0%,5%{stroke-dashoffset:100;opacity:0}5.5%{opacity:1}17%,100%{stroke-dashoffset:0;opacity:1}}
  @keyframes spDrawF{0%,13%{stroke-dashoffset:100;opacity:0}13.5%{opacity:1}25%,100%{stroke-dashoffset:0;opacity:1}}
  @keyframes spKo{0%,19%{opacity:0}20%,100%{opacity:1}}
  @keyframes spPop1{0%,24%{transform:scale(0)}28%{transform:scale(1.3)}30%,100%{transform:scale(1)}}
  @keyframes spPop2{0%,28%{transform:scale(0)}32%{transform:scale(1.3)}34%,100%{transform:scale(1)}}
  @keyframes spPop3{0%,32%{transform:scale(0)}36%{transform:scale(1.3)}38%,100%{transform:scale(1)}}
  @keyframes spNb{0%,48%{opacity:0}51%,100%{opacity:1}}
  @keyframes spBtn{0%,40%{opacity:0}41%,100%{opacity:1}}
  @keyframes spGlow{0%,40%{opacity:0}45%{opacity:1}65%,100%{opacity:.55}}
  @keyframes spRip{0%,40%{transform:scale(.25);opacity:0}41%{opacity:.9}58%,100%{transform:scale(1);opacity:0}}
  @keyframes spWm{0%,50%{opacity:0;letter-spacing:.8em}64%,100%{opacity:1;letter-spacing:.42em}}

  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation:none!important;transition:none!important}
    .sp-arcB,.sp-arcF{stroke-dasharray:none}
  }
</style>
</head>

const sheetTimers = {};

function openSheet(id){
  const sc = $(id); clearTimeout(sheetTimers[id]);
  sc.classList.remove('closing'); sc.classList.add('show'); syncLock();
}
function closeSheet(id){
  const sc = $(id); if (!sc.classList.contains('show') || sc.classList.contains('closing')) return;
  if (document.activeElement && sc.contains(document.activeElement)) document.activeElement.blur();
  sc.classList.add('closing'); syncLock();
  sheetTimers[id] = setTimeout(() => { sc.classList.remove('show','closing'); syncLock(); }, 320);
}

}));

function markSVG({bg='#0A0A0B', small=false, nodes=true, orbit=false, blue=true, inner=false}={}){
  const sw = small ? 12 : 7, r = small ? 16 : 10, ko = small ? 24 : 17;
  const rot = 'translate(100 100) rotate(-20)';
  const path = 'M 88 0 A 88 30 0 0 1 -88 0 A 88 30 0 0 1 88 0';
  const dot = vis => `<circle r="${r}" fill="#3366FF" stroke="${bg}" stroke-width="4"><animateMotion dur="6s" repeatCount="indefinite" path="${path}"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="${vis}"/></circle>`;
  const body = `<path transform="${rot}" d="M -88 0 A 88 30 0 0 1 88 0" fill="none" stroke="#F4F4F1" stroke-width="${sw}" stroke-linecap="round"/>
    ${orbit ? `<g transform="${rot}">${dot('0;1')}</g>` : ''}
    <rect x="83" y="25" width="34" height="150" rx="17" fill="#F4F4F1"/><rect x="94" y="84" width="12" height="32" rx="6" fill="#3366FF"/>
    <g transform="${rot}" fill="none">
      <path d="M 15.28 29.54 A 88 30 0 0 1 -35.79 27.41" stroke="${bg}" stroke-width="${ko}"/>
      <path d="M 88 0 A 88 30 0 0 1 -88 0" stroke="#F4F4F1" stroke-width="${sw}" stroke-linecap="round"/>
      ${nodes ? `<circle cx="-82.7" cy="-10.3" r="10" fill="#F4F4F1" stroke="${bg}" stroke-width="4"/><circle cx="-50.5" cy="24.6" r="10" fill="#F4F4F1" stroke="${bg}" stroke-width="4"/>` : ''}
      ${orbit ? dot('1;0') : (blue ? `<circle cx="85" cy="-7.8" r="${r}" fill="#3366FF" stroke="${bg}" stroke-width="4"/>` : '')}
    </g>`;
  return inner ? body : `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
$('#hdrIcon').innerHTML = markSVG({small:true, nodes:false, orbit:true});

function stepLevel(dir){
  if (!S.esc.enabled){ toast(T.escIsOff); return; }
  const L = S.esc.levels;
  const prev = S.current;
  const next = Math.max(0, Math.min(L.length, S.current + dir));
  if (next === S.current){ toast(dir > 0 ? T.highest : T.alreadyIdle); return; }
  S.current = next;
  const names = ids => ids.length ? T.sentTo + ' ' + ids.map(cName).map(esc).join(', ') : T.nobody;
  if (dir < 0){
    const to = S.notified.length ? S.notified : L.flatMap(l => l.contacts);
    const leaving = L[prev-1];
    const msg = ((leaving && leaving.downMsg) || '').trim() || (S.esc.downMsg || '').trim() || T.downDefault;
    const lv = next ? L[next-1] : null;
    const sent = sendAlert(to, {title: lv ? `▼ ${T.level} ${next} · ${lv.name}` : `${T.alertLbl} · ${T.backNormal}`, text:msg, color: lv ? lv.color : '#6fd6a8'});
    if (next === 0) S.notified = [];
    save(); renderEsc();
    toast(`▼ ${lv ? `${T.level} ${next} · <b>${esc(lv.name)}</b>` : `<b>${T.backNormal}</b>`}<br>“${esc(msg)}” · ${names(sent)}`);
    return;
  }
  const l = L[next-1];
  const sent = sendAlert(l.contacts, {title:`▲ ${T.level} ${next} · ${l.name}`, text:hasText(l.action) ? l.message : '',
    loc:l.action==='location'||l.action==='alertloc', callme:l.action==='callme', sos:l.sos, color:l.color});
  S.notified = [...new Set([...S.notified, ...sent])]; save(); renderEsc(next-1);
  toast(`▲ ${T.level} ${next} · <b>${esc(l.name)}</b><br>${names(sent)}`);
}

document.querySelectorAll('#onboard .choice').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); renderHome(); closeSheet('#onboard'); });

/* ---------- fake call / text ---------- */
function showFakeCall(name){ name = (name || '').trim() || T.callerPh; $('#fakeCall').classList.remove('closing'); $('#fcName').textContent = name; $('#fcAv').textContent = name[0].toUpperCase(); $('#fakeCall').classList.add('show'); }
function closeFakeCall(){ const f = $('#fakeCall'); f.classList.add('closing'); setTimeout(() => f.classList.remove('show','closing'), 350); }
document.querySelectorAll('[data-fc]').forEach(b => b.onclick = closeFakeCall);
let ftT;
function showFakeText(name, text){
  $('#ftName').textContent = (name || '').trim() || T.callerPh; $('#ftText').textContent = text || '…';
  const b = $('#fakeText'); b.classList.add('show'); clearTimeout(ftT); ftT = setTimeout(() => b.classList.remove('show'), 4200);
}
$('#fakeText').onclick = () => $('#fakeText').classList.remove('show');

/* ---------- bracelet ---------- */
function flashButton(s){
  const g = $(s==='left' ? '#svgL' : '#svgR'), shape = g.querySelector('.btnshape');
  shape.classList.remove('pressed'); void shape.getBBox(); shape.classList.add('pressed');
  const rip = $(s==='left' ? '#ripL' : '#ripR'); rip.classList.remove('go'); void rip.getBBox(); rip.classList.add('go');
  const led = $('#led'); led.setAttribute('fill','#5b8cff'); setTimeout(() => led.setAttribute('fill', led.classList.contains('live') ? '#5b8cff' : '#3a3940'), 600);
  const row = $('#home-'+s); if (row){ row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 700); }
}
function runButton(s){
  flashButton(s);
  const b = S.buttons[s];
  if (b.type === 'contact'){
    const sent = sendAlert([b.contactId], {title:`${T.alertLbl} · ${BTN(s)}`, text:hasText(b.method) ? b.message : '', loc:b.method==='location'||b.method==='alertloc', callme:b.method==='callme'});
    toast(`<b>${BTN(s)}</b> · ${T['m_'+b.method]}<br>${T.sentTo} ${sent.map(cName).map(esc).join(', ')}`);
  } else if (b.cAction === 'fakecall') setTimeout(() => showFakeCall(b.cName), 350);
  else if (b.cAction === 'faketext') showFakeText(b.cName, b.cMessage);
  else { const sent = sendAlert([b.cContactId], {title:b.cLabel || T.customDefault, text:b.cMessage});
    toast(`<b>${esc(b.cLabel || T.customDefault)}</b><br>${T.sentTo} ${sent.map(cName).map(esc).join(', ')}`); }
}
function handleGesture(s, gesture){
  if (gesture === 'hold2') return runButton(s);
  flashButton(s);
  if (S.esc.upBtn===s && S.esc.upGes===gesture) return stepLevel(1);
  if (S.esc.downBtn===s && S.esc.downGes===gesture) return stepLevel(-1);
  toast(`${BTN(s)} · ${T['g_'+gesture]} (${T.notAssigned})`);
}
document.querySelectorAll('.hit').forEach(g => g.addEventListener('click', () => runButton(g.dataset.btn)));

/* ---------- Bluetooth ---------- */
let device = null, demo = false, devName = '', battery = '', statusKey = 'st_off', statusState = 'off';
function setStatus(state, key){
  statusState = state; statusKey = key;
  $('#dot').className = 'dot' + (state==='on' ? ' on' : state==='busy' ? ' busy' : '');
  $('#statusText').textContent = T[key] + (state === 'on' && battery ? ` · ${battery}` : '');
  $('#connectBtn').textContent = state==='on' ? T.disconnect : T.connect;
  $('#connectBtn').classList.toggle('acc', state!=='on'); $('#connectBtn').classList.toggle('ghost', state==='on');
  const led = $('#led'); led.classList.toggle('live', state==='on'); led.setAttribute('fill', state==='on' ? '#5b8cff' : '#3a3940');
}
function showBtHelp(reason){ $('#btReason').textContent = reason; openSheet('#btSheet'); }
$('#btClose').onclick = () => closeSheet('#btSheet');
$('#btDemo').onclick = () => {
  closeSheet('#btSheet'); demo = true; setStatus('busy','st_connecting');
  setTimeout(() => { devName = 'ORBITA-Demo'; battery = '86%'; setStatus('on','st_demo'); toast(T.demoConnected); }, 900);
};
const GESTURE_MAP = {0x01:['left','hold2'],0x02:['right','hold2'],0x11:['left','double'],0x12:['right','double'],0x21:['left','triple'],0x22:['right','triple'],0x31:['left','hold5'],0x32:['right','hold5']};
async function connect(){
  if (device || demo){ if (device && device.gatt.connected) device.gatt.disconnect(); device = null; demo = false; devName = battery = ''; setStatus('off','st_off'); return; }
  if (!('bluetooth' in navigator)){ showBtHelp(T.btNoSupport); return; }
  try {
    setStatus('busy','st_search');
    device = await navigator.bluetooth.requestDevice({acceptAllDevices:true, optionalServices:['battery_service', ORBITA_SERVICE]});
    device.addEventListener('gattserverdisconnected', () => { device = null; devName = battery = ''; setStatus('off','st_disc'); toast(T.btDisc); });
    setStatus('busy','st_connecting');
    const server = await device.gatt.connect();
    devName = device.name || '—'; setStatus('on','st_on'); toast(`${T.connectedTo} <b>${esc(devName)}</b>`);
    try { const bs = await server.getPrimaryService('battery_service'); const ch = await bs.getCharacteristic('battery_level');
      const v = await ch.readValue(); battery = v.getUint8(0) + '%'; setStatus('on','st_on'); } catch(e){}
    try { const os = await server.getPrimaryService(ORBITA_SERVICE); const ev = await os.getCharacteristic(ORBITA_EVENT);
      await ev.startNotifications(); ev.addEventListener('characteristicvaluechanged', e => { const g = GESTURE_MAP[e.target.value.getUint8(0)]; if (g) handleGesture(g[0], g[1]); });
    } catch(e){ toast(T.noService); }
  } catch(err){
    device = null; setStatus('off','st_off');
    if (err && err.name === 'NotFoundError') return;
    showBtHelp(err && err.name === 'SecurityError' ? T.btBlocked : T.btFail + (err && err.message || err));
  }
}
$('#connectBtn').onclick = connect;

/* ---------- language / render all ---------- */
function renderAll(){ renderHome(); renderButtonsView(); renderEsc(); renderChats(); renderBadge(); if (thread) renderThread(); }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.innerHTML = T[el.dataset.i18n]);
  $('#msgInput').placeholder = T.typePh;
  setStatus(statusState, statusKey);
  renderAll(); requestAnimationFrame(moveTabPill);
}

/* ---------- launch animation ---------- */
function bootDone(){
  const sp = $('#splash'); if (!sp || sp.classList.contains('out')) return;
  sp.classList.add('out'); document.body.classList.remove('booting');
  const v = $('#v-home'); v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  if (!S.mode) setTimeout(() => openSheet('#onboard'), 350);
  setTimeout(() => sp.remove(), 500);
}
(function boot(){
  const fit = () => { const b = $('#spBox'); if (b) b.style.transform = `scale(${Math.min(innerWidth/390, innerHeight/844, 1.4)})`; };
  fit(); addEventListener('resize', fit);
  setTimeout(bootDone, matchMedia('(prefers-reduced-motion: reduce)').matches ? 900 : 3700);
  $('#splash').addEventListener('click', bootDone);
})();

applyLang();
$('#v-home').classList.add('enter');
addEventListener('resize', () => moveSeg(true));
if (document.fonts) document.fonts.ready.then(() => { moveSeg(true); moveTabPill(); });
moveTabPill();
</script>
